<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080c">
  <meta name="description" content="SportDash — acceso privado al centro deportivo.">
  <title>SportDash — Iniciar sesión</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand" aria-label="SportDash">
        <div class="brand-mark">S</div>
        <div class="brand-copy">
          <strong>SPORT<span>DASH</span></strong>
          <small>PREMIUM</small>
        </div>
      </div>

      <div class="login-heading">
        <p class="eyebrow">CENTRO DEPORTIVO PRIVADO</p>
        <h1 id="login-title">Bienvenido</h1>
        <p>Ingresá con tu usuario y contraseña para continuar.</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Ingresá tu usuario"
            minlength="3"
            maxlength="80"
            required
            autofocus
          >
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Ingresá tu contraseña"
              maxlength="200"
              required
            >
            <button id="toggle-password" class="password-toggle" type="button" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div id="login-message" class="login-message" role="alert" aria-live="polite"></div>

        <button id="login-submit" class="login-submit" type="submit">
          <span class="submit-label">Iniciar sesión</span>
          <span class="submit-loader" aria-hidden="true"></span>
        </button>
      </form>

      <footer class="login-footer">
        <span>Acceso protegido</span>
        <span aria-hidden="true">•</span>
        <span>SportDash Premium</span>
      </footer>
    </section>
  </main>

  <script src="/js/login.js" defer></script>
</body>
</html>
